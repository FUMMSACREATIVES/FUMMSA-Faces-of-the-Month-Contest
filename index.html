<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUMMSA Face of the Week</title>
<style>
  body { 
    font-family: 'Segoe UI', sans-serif; 
    background: linear-gradient(-45deg, #4b0082, #ffffff, #8e44ad, #ffffff);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    padding: 20px; margin: 0; min-height: 100vh; position: relative; overflow-x: hidden;
  }
  @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: url('Contest.jpg'); background-repeat: no-repeat; background-position: center; background-size: 85%; opacity: 0.12; z-index: -1; }
  .container { max-width: 500px; margin: auto; position: relative; z-index: 1; }
  .top-logo { display: block; margin: 0 auto 10px auto; max-width: 120px; height: auto; }
  form, .list-section { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px); padding: 20px; margin-bottom: 20px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
  input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #ddd; box-sizing: border-box; }
  button { background: #6c3483; color: #fff; border: none; cursor: pointer; font-weight: bold; transition: transform 0.2s ease; }
  button:active { transform: scale(0.98); }
  .hidden { display: none; }
  .pts { float: right; font-weight: bold; color: #8e44ad; }
  h1 { text-align: center; color: #ffffff; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
</style>
</head>
<body>

<div class="container">
    <img src="Logo.jpg" alt="Logo" class="top-logo">
    <h1>FUMMSA Faces of the Month</h1>
    <div style="text-align: center; margin-bottom: 10px; color: white;">
      Slots Remaining: <span id="slotsLeft">20</span> / 20
    </div>
    
    <div id="regSection">
      <form id="registrationForm">
        <h3>1. Register as a Contestant</h3>
        <input type="text" id="regName" placeholder="Your FULL NAME (e.g. John Doe)" required>
        <input type="text" id="regUsername" placeholder="TikTok Username" required>
        <input type="text" id="regIG" placeholder="Instagram Username" required>
        <button type="submit">Join Contest</button>
      </form>
    </div>

    <div id="refSection" class="hidden">
      <form id="referralForm">
        <h3 id="refTitle">Submit Support</h3>
        <div id="contestantControls" class="hidden">
           <button type="button" id="shareBtn" style="background:#27ae60;">Copy My Referral Link 🔗</button>
           <hr>
        </div>
        <div id="votingInputs">
          <p id="refInstructions">Enter handles and upload proof to support:</p>
          <input type="text" id="friendHandle" placeholder="YOUR TikTok Username (Optional)">
          <input type="text" id="friendIG" placeholder="YOUR Instagram Username (Optional)">
          <input type="file" id="screenshot" accept="image/*" required>
          <button type="submit" id="voteBtn">Submit My Vote</button>
        </div>
        <button type="button" onclick="logout()" style="background:#95a5a6; margin-top:5px;">Logout / Back to Home</button>
      </form>
    </div>

    <div class="list-section">
      <h3>🏆 Leaderboard</h3>
      <ul id="leaderboard" style="list-style: none; padding: 0;"></ul>
    </div>

    <div class="list-section" style="border-top: 2px solid #e74c3c; margin-top: 50px;">
      <h3>🔍 Admin: Vote Verification</h3>
      <button onclick="viewVotes()" style="background:#2c3e50;">View Voter List</button>
      <button id="csvBtn" class="hidden" onclick="downloadCSV()" style="background:#27ae60; margin-top:10px;">Download CSV 📊</button>
      <ul id="adminVoteList" style="font-size: 0.8em; text-align: left; margin-top: 10px; padding: 0;"></ul>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, update, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = { databaseURL: "https://fummsa-face-of-the-week-default-rtdb.europe-west1.firebasedatabase.app/" };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // FIXED: Aggressive clean function to remove emojis and special characters
  const clean = (str) => str ? str.trim().toLowerCase().replace(/[^\w]/gi, '') : "";

  let referrerUid = ""; 
  let totalParticipants = 0;
  let allVotesData = {};

  window.onload = () => {
    const urlParams = new URLSearchParams(window.location.search);
    referrerUid = clean(urlParams.get('ref') || ""); 
    const savedUser = sessionStorage.getItem("fow_user");
    if (savedUser) showDashboard(savedUser, true);
    else if (referrerUid) showDashboard(referrerUid, false);
  };

  function showDashboard(id, isOwner) {
    document.getElementById('regSection').classList.add('hidden');
    document.getElementById('refSection').classList.remove('hidden');
    if (isOwner) {
      document.getElementById('refTitle').innerText = "Dashboard: " + id.toUpperCase();
      document.getElementById('contestantControls').classList.remove('hidden');
      document.getElementById('votingInputs').classList.add('hidden'); 
    } else {
      document.getElementById('refTitle').innerText = "Supporting: " + id.toUpperCase();
      document.getElementById('contestantControls').classList.add('hidden');
      document.getElementById('votingInputs').classList.remove('hidden');
    }
  }

  onValue(ref(db, '/'), (snap) => {
    const root = snap.val() || {};
    const participants = root.participants || {};
    allVotesData = root.usedHandles || {};
    totalParticipants = Object.keys(participants).length;
    document.getElementById('slotsLeft').innerText = Math.max(0, 20 - totalParticipants);

    const list = document.getElementById('leaderboard');
    list.innerHTML = "";
    Object.values(participants).sort((a,b) => b.points - a.points).forEach((p, i) => {
      list.innerHTML += `<li style="margin-bottom:8px;">#${i+1} ${p.name} <span class="pts">${p.points} Pts</span></li>`;
    });
  });

  document.getElementById('registrationForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (totalParticipants >= 20) return alert("Slots full!");
    const name = document.getElementById('regName').value.trim();
    const userId = clean(name); 

    await set(ref(db, 'participants/' + userId), { 
      name: name, tiktok: document.getElementById('regUsername').value, ig: document.getElementById('regIG').value, points: 0 
    });
    sessionStorage.setItem("fow_user", userId);
    location.reload(); 
  });

  document.getElementById('referralForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const tk = document.getElementById('friendHandle').value.trim();
    const ig = document.getElementById('friendIG').value.trim();
    const file = document.getElementById('screenshot').files[0];
    const btn = document.getElementById('voteBtn');

    // Voter must provide at least one handle
    if (!tk && !ig) return alert("Please provide at least one handle!");
    if (!file) return alert("Upload proof!");
    if (!referrerUid || referrerUid === sessionStorage.getItem("fow_user")) return alert("Invalid link or self-voting!");

    const voterId = clean(tk || ig);

    try {
        btn.disabled = true;
        btn.innerText = "Processing...";

        const usedSnap = await get(ref(db, 'usedHandles/' + voterId));
        if (usedSnap.exists()) throw new Error("This handle has already voted!");

        const contestantRef = ref(db, 'participants/' + referrerUid);
        const contestantSnap = await get(contestantRef);
        if (!contestantSnap.exists()) throw new Error("Contestant not found! Ensure the link name matches the registered name.");

        // FIXED: Using Base64 to save images without needing Firebase Storage
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async () => {
            await update(contestantRef, { points: (contestantSnap.val().points || 0) + 1 });
            await set(ref(db, 'usedHandles/' + voterId), { 
                votedFor: referrerUid, 
                proof: reader.result, 
                time: new Date().toLocaleString() 
            });
            alert("Point awarded!");
            location.reload();
        };
    } catch (err) {
        alert(err.message);
        btn.disabled = false;
        btn.innerText = "Submit My Vote";
    }
  });

  window.viewVotes = () => {
    const pass = prompt("Admin Password:");
    if (pass === "FUMMSA2026") {
        const list = document.getElementById('adminVoteList');
        list.innerHTML = "";
        document.getElementById('csvBtn').classList.remove('hidden');
        for (let id in allVotesData) {
            const vote = allVotesData[id];
            list.innerHTML += `
                <li style="margin-bottom:15px; border-bottom:1px solid #ddd; padding-bottom:10px; list-style:none;">
                    <b>Voter:</b> @${id} <br>
                    <b>Supporting:</b> ${vote.votedFor} <br>
                    <img src="${vote.proof}" style="max-width:150px; border:2px solid #6c3483; margin-top:5px; border-radius:5px; cursor:pointer;" 
                         onclick="this.style.maxWidth = this.style.maxWidth === '150px' ? '100%' : '150px'">
                    <br><small>Tap image to zoom in/out</small>
                </li>`;
        }
    } else alert("Wrong Password!");
  };

  window.downloadCSV = () => {
    let csvContent = "data:text/csv;charset=utf-8,Voter,Voted For,Time\n";
    for (let id in allVotesData) {
        csvContent += `${id},${allVotesData[id].votedFor},${allVotesData[id].time}\n`;
    }
    const link = document.createElement("a");
    link.setAttribute("href", encodeURI(csvContent));
    link.setAttribute("download", "FUMMSA_Votes.csv");
    document.body.appendChild(link);
    link.click();
  };

  document.getElementById('shareBtn').onclick = () => {
    const link = window.location.origin + window.location.pathname + "?ref=" + sessionStorage.getItem("fow_user");
    navigator.clipboard.writeText(link).then(() => alert("Referral Link Copied!"));
  };

  window.logout = () => { sessionStorage.removeItem("fow_user"); window.location.href = window.location.origin + window.location.pathname; };
</script>
</body>
</html>
